    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {}
      })();
    </script>
